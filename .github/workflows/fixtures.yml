name: Update football fixtures

on:
  workflow_dispatch:
  schedule:
    - cron: '7 */2 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  fixtures:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create latest club schedule
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: python update_matches.py

      - name: Add national team fixtures
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python add_national.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload public schedule
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy public schedule
        id: deployment
        uses: actions/deploy-pages@v4
